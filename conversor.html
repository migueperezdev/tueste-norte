<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de precios</title>
</head>

<body>
    <main>
        <h1>Conversor de precios</h1>

        <label for="precio">Precio del paquete de 250 g:</label>
        <input type="number" id="precio" step="0.01" min="0">

        <button type="button" id="calcular">Calcular</button>

        <p id="resultado"></p>
    </main>

    <script src="conversor.js"></script>
</body>

</html>
