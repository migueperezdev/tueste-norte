<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción a la cata</title>
</head>

<body>
    <main>
        <h1>Inscripción a la próxima cata</h1>

        <form action="cata.php" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="plazas">Número de plazas:</label>
            <input type="number" id="plazas" name="plazas" min="1" max="4" step="1" required>

            <button type="submit">Reservar plaza</button>
        </form>
    </main>
</body>

</html>
